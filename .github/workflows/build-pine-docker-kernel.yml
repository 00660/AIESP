name: Build pine Docker kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel source repository
        required: true
        default: https://github.com/hsx02/kernel_xiaomi_sdm439.git
      kernel_ref:
        description: Kernel source branch/tag/ref
        required: true
        default: a12/main
      defconfig:
        description: Fallback defconfig when current.config is not used
        required: true
        default: pine-perf_defconfig
      toolchain:
        description: clang or gcc
        required: true
        default: clang
        type: choice
        options:
          - clang
          - gcc
      kernel_release:
        description: Kernel release string expected by the ROM VINTF check
        required: true
        default: 4.9.297-perf/pine-g3ce83b96c7ea
  push:
    branches:
      - pine-docker-kernel
    paths:
      - .github/workflows/build-pine-docker-kernel.yml
      - android-pine-docker-kernel-20260529-090250/**

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout AIESP build inputs
        uses: actions/checkout@v4

      - name: Build kernel
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/hsx02/kernel_xiaomi_sdm439.git' }}
          KERNEL_REF: ${{ inputs.kernel_ref || 'a12/main' }}
          DEFCONFIG: ${{ inputs.defconfig || 'pine-perf_defconfig' }}
          BASE_CONFIG: android-pine-docker-kernel-20260529-090250/current.config
          TOOLCHAIN: ${{ inputs.toolchain || 'clang' }}
          KERNEL_RELEASE: ${{ inputs.kernel_release || '4.9.297-perf/pine-g3ce83b96c7ea' }}
        run: |
          chmod +x android-pine-docker-kernel-20260529-090250/scripts/build-pine-docker-kernel.sh
          android-pine-docker-kernel-20260529-090250/scripts/build-pine-docker-kernel.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pine-docker-kernel
          path: android-pine-docker-kernel-20260529-090250/artifacts/*
          if-no-files-found: error
